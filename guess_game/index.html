<!DOCTYPE html>
<html>
    <head>
        <title> Guess a Number </title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>

        <header>
            <h1>Guess the Number!</h1>
            <h2>Guess a number between 1 and 99 in seven attempts!</h2>
        </header>
        <br>
        <div id="main">
            Enter a guess:
            <input type="text" id="playerGuess" size="5">
            <button id="guessBtn"> Guess </button>
            <button id="resetBtn"> Reset </button>
            <div id="feedback"></div>
            <div class="game-info">
                Previous Guesses:
                <span id="guesses"></span>
            </div>
            
            <div class="game-info">
                Attempts Left:
                <span id="attemptsLeft">7</span>
            </div>
            <div class="scoreboard">
                <div class="score">
                    <span id="wins">0</span>
                    <p>Wins</p>
                </div>
            
                <div class="score">
                    <span id="losses">0</span>
                    <p>Losses</p>
                </div>
            </div>
        </div>
    
        <script src="js/script.js"></script>

        <footer>
            <p>Harvey Duran. All rights reserved.<br>
            This site is for academic purposes only.<br>
            CST 336 Internet Programming.</p>
            <img src="img/csumb_logo.png" width="400" height="150" style="opacity: 0.5;" alt="CSUMB Logo">
          </footer>

    </body>
</html>
